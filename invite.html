<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邀请你使用 AthliMate</title>
  <meta name="description" content="注册可获得15天PRO会员">
  <meta property="og:type" content="website">
  <meta property="og:title" content="邀请你使用 AthliMate">
  <meta property="og:description" content="注册可获得15天PRO会员">
  <meta property="og:image" content="https://athlimate.com/invite-og.png">
  <meta property="og:url" content="https://athlimate.com/invite.html">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #f5f7fa 0%, #e8ecf1 100%);
      color: #1a1a1a;
    }
    .card {
      max-width: 360px;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin: 0 auto 20px;
      display: block;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 15px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #007AFF;
      color: #fff;
    }
    .btn-secondary {
      background: #fff;
      color: #007AFF;
      border: 1px solid #007AFF;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: #999;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="invite-og.png" alt="AthliMate">
    <h1>邀请你使用 AthliMate</h1>
    <p class="desc" id="desc">注册可获得15天PRO会员</p>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="openBtn">打开 AthliMate</button>
      <a class="btn btn-secondary" id="downloadBtn" href="https://apps.apple.com/app/id6754246554">下载 App</a>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <script>
    (function () {
      var APP_STORE = "https://apps.apple.com/app/id6754246554";
      var PASTEBOARD_PREFIX = "athlimate_invite:";
      var params = new URLSearchParams(window.location.search);
      var raw = (params.get("code") || "").trim().toUpperCase();
      var code = /^[A-Z0-9]{8}$/.test(raw) ? raw : null;

      var openBtn = document.getElementById("openBtn");
      var downloadBtn = document.getElementById("downloadBtn");
      var hint = document.getElementById("hint");
      var appPossiblyOpened = false;

      function schemeUrl(inviteCode) {
        return "athlimate://invite?code=" + encodeURIComponent(inviteCode);
      }

      function writeClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).catch(function () {
            fallbackCopy(text);
          });
        }
        fallbackCopy(text);
        return Promise.resolve();
      }

      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
      }

      function markAppPossiblyOpened() {
        if (appPossiblyOpened) return;
        appPossiblyOpened = true;
        hint.textContent = "已尝试打开 App，请在 App 内完成注册（邀请码将自动识别）。";
      }

      function tryOpenApp() {
        if (!code) return;
        window.location.href = schemeUrl(code);
      }

      function prepareAndOpen() {
        if (!code) return;
        writeClipboard(PASTEBOARD_PREFIX + code).finally(function () {
          tryOpenApp();
          hint.textContent = "正在打开 App…若未跳转，请点「打开 AthliMate」。";
        });
      }

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") markAppPossiblyOpened();
      });
      window.addEventListener("pagehide", markAppPossiblyOpened);
      window.addEventListener("blur", markAppPossiblyOpened);

      openBtn.addEventListener("click", prepareAndOpen);
      downloadBtn.href = APP_STORE;

      if (code) {
        prepareAndOpen();
        setTimeout(function () {
          if (!appPossiblyOpened) {
            hint.textContent = "请使用浏览器打开本页面，未安装请先点「下载 App」。";
          }
        }, 1500);
      } else {
        openBtn.disabled = true;
        openBtn.textContent = "邀请码无效";
        hint.textContent = "邀请码无效，请从 App 内重新分享链接";
      }
    })();
  </script>
</body>
</html>
