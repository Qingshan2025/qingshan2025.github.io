<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Service Agreement - Athlimate</title>
    <meta name="description" content="Athlimate Membership Service Agreement. Learn about our membership terms and your rights and obligations.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/logo1024.png" alt="Athlimate Logo" class="nav-logo">
                Athlimate
            </a>
            <a href="index.html" class="btn btn-primary">Back to home</a>
        </div>
    </nav>

    <main class="policy-page">
        <div class="container">
            <div id="content" class="markdown-body">
                Loading the membership agreement...
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="copyright">&copy; 2026 Athlimate Team. All rights reserved.</p>
        </div>
    </footer>

    <script>
        loadLegalDocument('MemberServiceAgreement.en.md', 'Loading the membership agreement...', 'Unable to load the membership agreement.');

        async function loadLegalDocument(file, loadingText, failureText) {
            const content = document.getElementById('content');
            content.textContent = loadingText;
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error('missing');
                content.innerHTML = marked.parse(await response.text());
            } catch (err) {
                content.textContent = failureText;
                console.error(err);
            }
        }
    </script>
</body>

</html>
